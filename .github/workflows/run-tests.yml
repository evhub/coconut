name: Coconut Test Suite
on: [push]
concurrency:
  # cancel superseded runs on the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # EOL Pythons have to be built from source, which fails on newer Ubuntus (e.g. missing lzma-dev on 26.04)
    runs-on: ${{ contains(fromJSON('["2.7", "3.7", "3.8", "3.9"]'), matrix.python-version) && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version:
          - '2.7'
          - '3.7'
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - 'pypy-2.7'
          - 'pypy-3.9'
          - 'pypy-3.10'
          - 'pypy-3.11'
      fail-fast: false
    name: Python ${{ matrix.python-version }}
    # a normal run takes about an hour, so anything much longer means something is hanging
    timeout-minutes: 150
    env:
      # make sure the log shows exactly where things got to if a job does hang
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: make install
      - run: make test-all
      - run: make build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true
